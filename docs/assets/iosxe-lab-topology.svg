<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1312" viewBox="0 0 2000 1312" font-family="Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <!-- White-background companion to meraki_lab_diagram_v2.png, same visual
       language (black line-art boxes, green accent status dot, bold black
       labels, bold blue caption) applied to the IOS-XE device topology.
       Coordinate system is 2x the original hand-drawn draft so stroke
       widths and font sizes read at the same visual weight as the PNG's
       native 2008x1316 resolution when both are displayed at equal width. -->
  <title id="t">Part 2 - IOS-XE lab topology</title>
  <desc id="d">Border connects to Core; Core connects to the two access switches Access1 and Access2; each access switch hosts one unmanaged Alpine Linux end host, Host1 and Host2. All on one shared 198.18.128.0/18 subnet.</desc>
  <rect width="2000" height="1312" fill="#ffffff"/>

  <!-- connectors: Border -> Core -> (Access1, Access2) -> (Host1, Host2) -->
  <g stroke="#333333" stroke-width="4" fill="none">
    <line x1="1000" y1="260" x2="1000" y2="400"/>
    <path d="M1000,580 L1000,640 L460,640 L460,760"/>
    <path d="M1000,640 L1540,640 L1540,760"/>
    <line x1="460" y1="940" x2="460" y2="1040"/>
    <line x1="1540" y1="940" x2="1540" y2="1040"/>
  </g>

  <!-- Border -->
  <g>
    <rect x="800" y="80" width="400" height="180" rx="20" fill="#ffffff" stroke="#333333" stroke-width="7"/>
    <rect x="926" y="120" width="52" height="32" rx="6" fill="none" stroke="#333333" stroke-width="4"/>
    <rect x="936" y="140" width="4" height="8" fill="#333333"/>
    <rect x="948" y="140" width="4" height="8" fill="#333333"/>
    <rect x="960" y="140" width="4" height="8" fill="#333333"/>
    <rect x="972" y="140" width="4" height="8" fill="#333333"/>
    <circle cx="980" cy="116" r="7" fill="#6dbf3c"/>
    <text x="1000" y="200" text-anchor="middle" font-size="34" font-weight="700" fill="#1a1a1a">Border</text>
    <text x="1000" y="236" text-anchor="middle" font-size="24" fill="#666666">Edge / external-facing</text>
  </g>

  <!-- Core -->
  <g>
    <rect x="800" y="400" width="400" height="180" rx="20" fill="#ffffff" stroke="#333333" stroke-width="7"/>
    <rect x="926" y="440" width="52" height="32" rx="6" fill="none" stroke="#333333" stroke-width="4"/>
    <rect x="936" y="460" width="4" height="8" fill="#333333"/>
    <rect x="948" y="460" width="4" height="8" fill="#333333"/>
    <rect x="960" y="460" width="4" height="8" fill="#333333"/>
    <rect x="972" y="460" width="4" height="8" fill="#333333"/>
    <circle cx="980" cy="436" r="7" fill="#6dbf3c"/>
    <text x="1000" y="520" text-anchor="middle" font-size="34" font-weight="700" fill="#1a1a1a">Core</text>
    <text x="1000" y="556" text-anchor="middle" font-size="24" fill="#666666">L3 core</text>
  </g>

  <!-- Access1 -->
  <g>
    <rect x="240" y="760" width="440" height="180" rx="20" fill="#ffffff" stroke="#333333" stroke-width="7"/>
    <rect x="366" y="800" width="52" height="32" rx="6" fill="none" stroke="#333333" stroke-width="4"/>
    <rect x="376" y="820" width="4" height="8" fill="#333333"/>
    <rect x="388" y="820" width="4" height="8" fill="#333333"/>
    <rect x="400" y="820" width="4" height="8" fill="#333333"/>
    <rect x="412" y="820" width="4" height="8" fill="#333333"/>
    <circle cx="420" cy="796" r="7" fill="#6dbf3c"/>
    <text x="460" y="880" text-anchor="middle" font-size="34" font-weight="700" fill="#1a1a1a">Access1</text>
    <text x="460" y="916" text-anchor="middle" font-size="24" fill="#666666">Access switch</text>
  </g>

  <!-- Access2 -->
  <g>
    <rect x="1320" y="760" width="440" height="180" rx="20" fill="#ffffff" stroke="#333333" stroke-width="7"/>
    <rect x="1446" y="800" width="52" height="32" rx="6" fill="none" stroke="#333333" stroke-width="4"/>
    <rect x="1456" y="820" width="4" height="8" fill="#333333"/>
    <rect x="1468" y="820" width="4" height="8" fill="#333333"/>
    <rect x="1480" y="820" width="4" height="8" fill="#333333"/>
    <rect x="1492" y="820" width="4" height="8" fill="#333333"/>
    <circle cx="1500" cy="796" r="7" fill="#6dbf3c"/>
    <text x="1540" y="880" text-anchor="middle" font-size="34" font-weight="700" fill="#1a1a1a">Access2</text>
    <text x="1540" y="916" text-anchor="middle" font-size="24" fill="#666666">Access switch</text>
  </g>

  <!-- Host1 (unmanaged - dashed border) -->
  <g>
    <rect x="240" y="1040" width="440" height="140" rx="20" fill="#ffffff" stroke="#9aa3ab" stroke-width="6" stroke-dasharray="12 8"/>
    <rect x="394" y="1070" width="36" height="26" rx="4" fill="none" stroke="#666666" stroke-width="4"/>
    <line x1="412" y1="1096" x2="412" y2="1106" stroke="#666666" stroke-width="4"/>
    <line x1="396" y1="1106" x2="428" y2="1106" stroke="#666666" stroke-width="4"/>
    <text x="460" y="1144" text-anchor="middle" font-size="30" font-weight="700" fill="#1a1a1a">Host1 (Alpine)</text>
  </g>

  <!-- Host2 (unmanaged - dashed border) -->
  <g>
    <rect x="1320" y="1040" width="440" height="140" rx="20" fill="#ffffff" stroke="#9aa3ab" stroke-width="6" stroke-dasharray="12 8"/>
    <rect x="1474" y="1070" width="36" height="26" rx="4" fill="none" stroke="#666666" stroke-width="4"/>
    <line x1="1492" y1="1096" x2="1492" y2="1106" stroke="#666666" stroke-width="4"/>
    <line x1="1476" y1="1106" x2="1508" y2="1106" stroke="#666666" stroke-width="4"/>
    <text x="1540" y="1144" text-anchor="middle" font-size="30" font-weight="700" fill="#1a1a1a">Host2 (Alpine)</text>
  </g>

  <text x="1000" y="1260" text-anchor="middle" font-size="28" font-weight="700" fill="#0a60ff">Border, Core, Access1, Access2 are Terraform-managed; Host1/Host2 (dashed) are unmanaged end hosts - all on 198.18.128.0/18</text>
</svg>
